[package]
name = "cascade-gtk"
version = "0.1.0"
edition = "2021"

[dependencies]
cascade-core = { path = "../cascade-core" }
cascade-relay = { path = "../cascade-relay" }
gtk4 = { version = "0.9", features = ["v4_10"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
futures-util = "0.3"
async-channel = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
