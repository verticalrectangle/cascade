[package]
name = "cascade-relay"
version = "0.1.0"
edition = "2021"
description = "omp-collab-compatible WebSocket relay and native guest host-bridge"

[[bin]]
name = "cascade-relay"
path = "src/main.rs"

[dependencies]
cascade-core = { path = "../cascade-core" }
anyhow = "1"
aes-gcm = "0.10"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64 = "0.22"
futures-util = "0.3"
rand = "0.8"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
whoami = "1"
rustls = { version = "0.23", features = ["ring"] }
